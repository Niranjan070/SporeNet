# Pathogenicity Weights for SporeNet Proxy Risk Labeling
# Inoculum = composite weighted burden over all 9 classes using literature-informed weights.
# Mycelium = context indicator only.

species_weights:
  magnaporthe_oryzae: 1.00       # Blast — critical
  fusarium: 0.70                 # Bakanae / seedling blight, toxins
  bipolaris: 0.60                # Brown spot of rice
  exserohilum: 0.50              # Brown / leaf spot
  alternaria: 0.45               # Leaf & grain spot
  curvularia: 0.40               # Kernel / leaf spot
  curvularia_eragrostidis: 0.30  # Minor foliar
  fusarium_microconidie: 0.50    # Microconidia phase / secondary propagule
  mycelium: 0.00                 # Hyphae — context indicator only
