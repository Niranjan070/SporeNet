# Pathogenicity Weights for SporeNet Proxy Risk Labeling
# Inoculum = class-0 (magnaporthe_oryzae) count ONLY. Classes 1-8 are benign background -> context features only.
# Pathogenicity weights: magnaporthe 1.0, all others 0.0.

species_weights:
  magnaporthe_oryzae: 1.00       # Primary target pathogen (Rice Blast anchor)
  alternaria: 0.00               # Benign background class
  bipolaris: 0.00                # Benign background class
  curvularia: 0.00               # Benign background class
  curvularia_eragrostidis: 0.00  # Benign background class
  exserohilum: 0.00              # Benign background class
  fusarium: 0.00                 # Benign background class
  fusarium_microconidie: 0.00    # Benign background class
  mycelium: 0.00                 # Benign background class
